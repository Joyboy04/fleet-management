services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: fleet
      RABBITMQ_DEFAULT_PASS: fleet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: .
      args:
        SERVICE: api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet?sslmode=disable
      MQTT_BROKER_URL: tcp://mosquitto:1883
      HTTP_ADDR: ":8080"
      OAUTH_CLIENT_ID: fleet-client
      OAUTH_CLIENT_SECRET: fleet-secret
      JWT_SECRET: dev-only-change-me
      TOKEN_TTL: 1h
      RABBITMQ_URL: amqp://fleet:fleet@rabbitmq:5672/
      GEOFENCE_NAME: Monas
      GEOFENCE_LAT: "-6.1754"
      GEOFENCE_LON: "106.8272"
      GEOFENCE_RADIUS_M: "50"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    restart: unless-stopped
    build:
      context: .
      args:
        SERVICE: worker
    environment:
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet?sslmode=disable
      RABBITMQ_URL: amqp://fleet:fleet@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      # the api applies the database schema on startup
      api:
        condition: service_healthy

  publisher:
    restart: unless-stopped
    build:
      context: .
      args:
        SERVICE: publisher
    environment:
      MQTT_BROKER_URL: tcp://mosquitto:1883
      VEHICLE_IDS: B1234XYZ,B5678ABC
    depends_on:
      mosquitto:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
  mosquitto-data:
